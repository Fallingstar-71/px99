<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRACE 轨迹实验室</title><style>html,body{margin:0}</style>
<style>
:root{--bg:#f5f6f8;--panel:#ffffff;--panel2:#f3f4f7;--line:#e4e6ec;--tx:#1c2030;--mut:#7a8095;--acc:#3556e0;--acc2:#3556e0;--acc-tx:#ffffff;--stage:#0a0b12;--danger:#d6414b;--shadow:0 12px 40px rgba(25,32,60,.16);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-tx);border-color:var(--acc);font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.ic{padding:4px 7px;min-width:28px}
button.on{border-color:var(--acc);color:var(--acc)}
button.dng:hover{border-color:var(--danger);color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:0;max-width:100%}
input[type=number]{width:72px}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
input[type=range]{accent-color:var(--acc);width:100%;min-width:0}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand b{font:600 19px "Cinzel","Noto Serif SC",serif;letter-spacing:.28em;color:var(--tx)}
.brand i{font-style:normal;font-size:10px;color:var(--mut);letter-spacing:.12em}
#pname{width:170px;font-weight:600}
.sp{flex:1}
.grp{display:flex;gap:4px;align-items:center}
main{display:grid;grid-template-columns:268px minmax(0,1fr) 300px;min-height:0}
.side{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 4px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.pane[hidden]{display:none}
.center{display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-width:0;min-height:0}
#stagewrap{position:relative;background:var(--stage);display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
#stage{display:block;box-shadow:0 0 0 1px var(--line);touch-action:none;cursor:crosshair}
#stagebar{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px)}
#stagebar button{background:rgba(18,20,28,.78);color:#e1e5f0;border-color:#2c3042;backdrop-filter:blur(4px)}
#stagebar button.on{border-color:#ffe3a3;color:#ffe3a3}
#hint{position:absolute;bottom:8px;left:10px;color:#8a91a8;font-size:11px;pointer-events:none;max-width:70%}
#transport{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#tcode{font:600 14px ui-monospace,Menlo,Consolas,monospace;min-width:96px;color:var(--acc)}
#tl{background:var(--panel);border-top:1px solid var(--line);height:232px;display:grid;grid-template-columns:150px minmax(0,1fr);min-height:0;position:relative}
#tlnames{overflow:hidden;border-right:1px solid var(--line);background:var(--panel)}
#tlscroll{overflow:auto;position:relative}
#tlinner{position:relative}
.tlrow{height:26px;border-bottom:1px solid var(--line);position:relative}
.tlname{height:26px;border-bottom:1px solid var(--line);padding:0 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;cursor:pointer}
.tlname.sel,.tlrow.sel{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.tlname i{width:9px;height:9px;border-radius:50%;flex:none}
#ruler{touch-action:none;height:24px;position:sticky;top:0;z-index:5;background:var(--panel2);border-bottom:1px solid var(--line);cursor:ew-resize}
#ruler span{position:absolute;top:4px;font-size:10px;color:var(--mut);transform:translateX(3px);pointer-events:none}
#ruler s{position:absolute;bottom:0;width:1px;height:7px;background:var(--mut)}
.bar{touch-action:none;position:absolute;top:5px;height:16px;border-radius:4px;opacity:.55;cursor:grab}
.bar.sel{opacity:.85}
.bar .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
.kf{position:absolute;top:8px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--panel);border:1.5px solid var(--tx);touch-action:none;cursor:ew-resize;z-index:2}
.kf.on{background:var(--acc)}
.mk{touch-action:none;position:absolute;top:4px;margin-left:-6px;width:12px;height:18px;border-radius:3px;background:var(--acc);cursor:ew-resize;z-index:2}
#phead{position:absolute;top:0;bottom:0;width:2px;background:#ff5a6a;z-index:6;pointer-events:none}
#phead:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#ff5a6a}
.endmark{position:absolute;top:5px;width:10px;height:16px;border-radius:3px;background:#ddd;opacity:.8;margin-left:-1px}
footer{display:flex;gap:14px;align-items:center;padding:4px 14px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);font-size:11px;flex-wrap:wrap}
footer .cr{margin-left:auto;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.card h4{margin:0;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.06em}
.f{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;align-items:center;gap:6px}
.f.s{grid-template-columns:76px minmax(0,1fr)}
.f span{color:var(--mut);font-size:12px}
.f b{font-weight:400;font-size:11px;color:var(--mut);text-align:right}
.f.chk{grid-template-columns:auto 1fr;justify-content:start}
.chlist{display:flex;flex-direction:column;gap:3px}
.chi{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;border-radius:7px;cursor:pointer}
.chi:hover{background:var(--panel2)}.chi.sel{border-color:var(--acc);background:var(--panel2)}
.chi.dragover{border-top:2px solid var(--acc)}
.chi .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.chi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chi button{padding:1px 5px;border:0;background:none;color:var(--mut)}
.chi button:hover{color:var(--acc)}
.chi.off .nm{opacity:.4;text-decoration:line-through}
.mut{color:var(--mut)}
.small{font-size:11px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s,visibility .22s;visibility:hidden;box-shadow:none}
.drawer.open{transform:none;visibility:visible;box-shadow:var(--shadow)}
.drawer.wide{width:min(720px,100vw)}
.drawer>header{padding:10px 14px;border-bottom:1px solid var(--line)}
.drawer>header h3{margin:0;font-size:15px;flex:1}
.dbody{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:94vh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mbox>header{border-bottom:1px solid var(--line)}
.mbox h3{margin:0;flex:1;font-size:15px}
.mbody{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){.mbody{grid-template-columns:1fr}}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.fcard{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.fcard:hover{border-color:var(--acc)}.fcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.fcard .pv{font-size:22px;line-height:1.2;white-space:nowrap;overflow:hidden}
.fcard small{color:var(--mut);font-size:10px}
.pal{display:flex;flex-direction:column;gap:3px;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel2)}
.pal:hover{border-color:var(--acc)}
.pal div{display:flex;height:16px;border-radius:4px;overflow:hidden}.pal div i{flex:1}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.tpl{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--panel2);display:flex;flex-direction:column}
.tpl:hover{border-color:var(--acc)}
.tpl canvas{width:100%;display:block;background:#05050a}
.tpl div{padding:6px 8px}.tpl b{display:block}.tpl span{color:var(--mut);font-size:11px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .1s}
#xprev{width:100%;background:#05050a;border:1px solid var(--line);border-radius:8px;display:block}
#xvideo{width:100%;border-radius:8px;background:#000;display:block}
.stops{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.stops .sw{display:flex;align-items:center;gap:2px}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);padding:8px 14px;border-radius:8px;z-index:90;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}

button{border-radius:8px;background:var(--panel);}
.card{background:var(--panel);border:1px solid var(--line)}
.pane{background:var(--bg)}
.chi:hover{background:var(--panel2)}.chi.sel{background:var(--panel);box-shadow:0 0 0 1.5px var(--acc)}
.tlname.sel,.tlrow.sel{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.fcard,.pal,.tpl{background:var(--panel)}
.seg button.on,.tabs button.on{color:var(--acc)}
.seg button.on{background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc);border-color:var(--acc)}
.pri.on{color:#fff}
#mnav{display:none}
.stage-fs{display:none}
/* ---- tablet / phone ---- */

  body[data-m="right"] #right{display:flex}
  body[data-m="tl"] #transport{order:2}body[data-m="tl"] #tl{order:3}
  #mnav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
  #mnav button{flex:1;border:0;border-radius:0;background:none;padding:10px 4px;color:var(--mut)}
  #mnav button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 2px 0 var(--acc)}
  #app{grid-template-rows:auto 1fr auto auto}
  #hint{display:none}
  .brand i{display:none}
  header{gap:6px;padding-top:6px;padding-bottom:6px}
  #pname{width:130px}
  footer{display:none}
  .drawer{width:100vw}
}
@media (max-width:640px){
  header .grp:has(#aspect) span,header .grp:has(#dur) span:last-child{display:none}
  #bFont,#bColor{display:none}
  #tcode{min-width:0;font-size:12px}
  #transport{gap:5px;padding:6px 8px}
  #tzoomwrap{display:none}
  #tl{grid-template-columns:92px minmax(0,1fr)!important}
  .f{grid-template-columns:70px minmax(0,1fr) 38px}
  button,select,input{font-size:14px}
  #stagebar button{padding:3px 7px;font-size:12px}
}
@media (min-width:1101px) and (max-width:1300px){main{grid-template-columns:230px minmax(0,1fr) 270px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{border:1px solid var(--line,#d9dde6);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip.on{background:var(--acc,#3b6cff);border-color:var(--acc,#3b6cff);color:#fff}

.swgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.sw{height:44px;position:relative;padding:0;border-radius:8px;overflow:hidden}.sw i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:1px 0;text-align:center}
.lyr{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}.lyr .chk{flex:0 0 92px;font-size:12px}.lyr-s{flex:1;display:flex;gap:4px;min-width:0}.lyr-s input{flex:1;min-width:0;width:0}
.sugg{display:flex;align-items:center;gap:4px;width:100%;margin:4px 0;text-align:left}.sugg b{flex:0 0 64px;font-size:12px}.sugg i{width:18px;height:18px;border-radius:50%;display:inline-block}
.stylegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stl{display:flex;flex-direction:column;align-items:flex-start;padding:10px;gap:2px}.stl span{font-size:11px;color:var(--mut)}
.fxrow{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}.dbody{overflow:auto;padding:10px 14px;flex:1}

#flow{display:flex;gap:2px}#flow button{border:0;background:none;color:var(--mut);padding:4px 8px;font-size:12px;border-radius:6px}#flow button i{font-style:normal;display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:var(--panel2);margin-right:4px;font-size:10px;text-align:center}#flow button.on{color:var(--acc);background:var(--panel2)}#flow button.on i{background:var(--acc);color:#fff}
.brand{cursor:pointer}.qh{position:absolute;right:8px;bottom:8px;z-index:3;opacity:.8}
.tplgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.tpl2{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}.tpl2 .cvh canvas{width:100%;display:block;background:#05050a}.tpl2 .ti{padding:6px 8px;flex:1}.tpl2 .ti b{display:block}.tpl2 .ti span{color:var(--mut);font-size:11px}.tpl2 .tb{display:flex;gap:4px;padding:0 8px 8px}.tpl2 .tb button{padding:3px 8px;font-size:12px}.tpl2 .tb .on{color:#e0a020}
.ovl{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:none}.ovl.open{display:block}.hwrap{max-width:960px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 18px 40px}.hhead h1{font-size:44px;letter-spacing:.2em;margin:20px 0 0}.hhead p{color:var(--mut);margin:4px 0 22px}
.hentry{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.hbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:12px;background:var(--panel);white-space:normal;text-align:left}.hbtn b{font-size:15px}.hbtn span{font-size:12px;color:var(--mut)}
.hmode{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.hmode .on{background:var(--acc);color:#fff;border-color:var(--acc)}

</style></head><body>
<div id="app">
<header>
  <div class="brand" id="bHome" title="回到首页"><b>TRACE</b><i>人物轨迹实验室 · 让每个人的故事，都有自己的轨迹</i></div>
  <nav id="flow"></nav>
  <input id="pname" type="text" aria-label="项目名称">
  <div class="grp"><button class="ic" id="bUndo" title="撤销 Ctrl+Z">↶</button><button class="ic" id="bRedo" title="重做 Ctrl+Shift+Z">↷</button></div>
  <div class="grp"><span class="mut small">画幅</span><select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option><option>21:9</option></select></div>
  <div class="grp"><span class="mut small">总时长</span><input id="dur" type="number" min="3" max="300" step="1"><span class="mut small">秒</span></div>
  <div class="sp"></div>
  <div class="grp">
    <button id="bTpl">模板库</button>
    <button data-act="saveWork" title="保存到我的作品">存为作品</button>
    <button id="bRestore" data-act="tplRestore" title="把当前项目恢复为模板初始状态">恢复模板</button>
    <button id="bScene">场景与风格</button>
    <button id="bFont">字体与文字</button>
    <button id="bColor">配色系统</button>
    <button data-act="fullscreen" title="全屏预览并播放">全屏预览</button>
    <button class="pri" id="bExport">导出视频</button>
    <button class="ic" data-act="theme" title="浅色/深色">◐</button><button class="ic" data-act="help" title="帮助">?</button>
  </div>
</header>
<main>
  <section class="side" id="left">
    <div class="tabs" id="ltabs"><button data-t="chars" class="on">角色</button><button data-t="events">事件</button><button data-t="texts">文字</button><button data-t="layers" class="adv">图层</button></div>
    <div class="pane" id="p-chars"></div>

'use strict';
const u8 = (...a) => Uint8Array.from(a);
function cat(parts) { let n = 0; parts.forEach(p => n += p.length); const o = new Uint8Array(n); let k = 0; parts.forEach(p => { o.set(p, k); k += p.length; }); return o; }

const be16 = n => u8((n >> 8) & 255, n & 255);
const str4 = s => u8(...[...s].map(c => c.charCodeAt(0)));

/* ---------- MP4 (H.264 / AVCC samples) ---------- */
function box(type, ...kids) { const body = cat(kids); return cat([be32(body.length + 8), str4(type), body]); }
function fullbox(type, ver, flags, ...kids) { return box(type, u8(ver, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255), ...kids); }
/* samples: [{data:Uint8Array, key:bool}], fps, avcC: Uint8Array */

  const mat = cat([be32(0x10000), be32(0), be32(0), be32(0), be32(0x10000), be32(0), be32(0), be32(0), be32(0x40000000)]);
  const sizes = cat(samples.map(s => be32(s.data.length)));
  const syncIdx = []; samples.forEach((s, i) => s.key && syncIdx.push(i + 1));
  const build = (off) => {
    const avc1 = box('avc1', new Uint8Array(6), be16(1), new Uint8Array(16), be16(width), be16(height), be32(0x480000), be32(0x480000), be32(0), be16(1), new Uint8Array(32), be16(0x18), be16(0xffff), box('avcC', avcC));
    const stbl = box('stbl',
      fullbox('stsd', 0, 0, be32(1), avc1),
      fullbox('stts', 0, 0, be32(1), be32(n), be32(DL)),
      fullbox('stss', 0, 0, be32(syncIdx.length), cat(syncIdx.map(be32))),
      fullbox('stsc', 0, 0, be32(1), be32(1), be32(n), be32(1)),
      fullbox('stsz', 0, 0, be32(0), be32(n), sizes),
      fullbox('stco', 0, 0, be32(1), be32(off)));

    const mdia = box('mdia', fullbox('mdhd', 0, 0, be32(0), be32(0), be32(TS), be32(dur), be16(0x55c4), be16(0)), fullbox('hdlr', 0, 0, be32(0), str4('vide'), new Uint8Array(12), u8(...[...'TRACE video'].map(c => c.charCodeAt(0)), 0)), minf);
    const trak = box('trak', fullbox('tkhd', 0, 3, be32(0), be32(0), be32(1), be32(0), be32(dur), new Uint8Array(8), be16(0), be16(0), be16(0), be16(0), mat, be32(width << 16), be32(height << 16)), mdia);

  };
  const moovSize = build(0).length;
  const mdatHead = 8, off = ftyp.length + moovSize + mdatHead;
  const moov = build(off);
  let total = 0; samples.forEach(s => total += s.data.length);
  const mdat = new Uint8Array(8 + total); mdat.set(be32(total + 8), 0); mdat.set(str4('mdat'), 4);
  let k = 8; samples.forEach(s => { mdat.set(s.data, k); k += s.data.length; });
  return new Blob([ftyp, moov, mdat], { type: 'video/mp4' });
}

/* ---------- WebM (VP9) ---------- */
function vint(n) { // EBML size
  for (let l = 1; l <= 8; l++) { if (n < Math.pow(2, 7 * l) - 1) { const o = new Uint8Array(l); let v = n; for (let i = l - 1; i >= 0; i--) { o[i] = v % 256; v = Math.floor(v / 256); } o[0] |= 1 << (8 - l); return o; } }

function uintBytes(n) { const o = []; do { o.unshift(n % 256); n = Math.floor(n / 256); } while (n > 0); return Uint8Array.from(o); }
const eb = (idBytes, data) => cat([idBytes, vint(data.length), data]);
const ebU = (id, n) => eb(id, uintBytes(n));
const ebS = (id, s) => eb(id, str4(s));
const ebF = (id, v) => { const b = new Uint8Array(8); new DataView(b.buffer).setFloat64(0, v); return eb(id, b); };

function liveStart() { if (LIVE.raf) return; const loop = now => { LIVE.raf = requestAnimationFrame(loop); if (now - LIVE.last < 90) return; LIVE.last = now; let any = false; LIVE.cards.forEach(c => { if (!c.isConnected) { LIVE.cards.delete(c); return; } if (c._st.vis) { any = true; c._st.draw(now); } }); }; LIVE.raf = requestAnimationFrame(loop); }

  tplCopy: a => { const t = tplOf(a.dataset.id), p = buildTpl(t); p.name = t.name + ' 副本'; const keep = P; P = p; saveWork(p.name); P = keep; toast('已复制到“我的作品”'); },
  tplPrev: a => { const t = tplOf(a.dataset.id), m = $('#mPrev'); m.classList.add('open'); const cv = $('#prevcv'); const pp = buildTpl(t), L = makeLayers(960, 540); cv.width = 960; cv.height = 540; $('#prevname').textContent = t.name + ' — ' + t.desc; $('#prevuse').dataset.id = t.id; let stop = false; m._stop = () => { stop = true; }; const go = now => { if (stop) return; const tt = (now / 1000) % (pp.duration + 2); try { renderFrame(pp, Math.min(tt, pp.duration), cv.getContext('2d', { alpha: false }), L, { cam: pp.camera.follow ? cameraAt(pp, Math.min(tt, pp.duration)) : { cx: pp.w / 2, cy: pp.h / 2, zoom: 1 } }); } catch (e) { } requestAnimationFrame(go); }; requestAnimationFrame(go); },
  closePrev: () => { const m = $('#mPrev'); m._stop && m._stop(); m.classList.remove('open'); },
  prevUse: a => { ACTS.closePrev(); ACTS.tplUse(a); },
  tplRestore: () => { if (!P.tpl || !tplOf(P.tpl)) return toast('该项目不是由模板创建的'); const b = $('#bRestore'); if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = '再点一次确认'; setTimeout(() => { delete b.dataset.arm; b.textContent = '恢复模板'; }, 3000); return; } const keep = P.name, id = P.tpl; loadProject(buildTpl(tplOf(id))); P.name = keep; syncHeader(); toast('已恢复为模板初始状态（可撤销）'); },
  randInspire: () => { const R = Math.random, ts = TEMPLATES.filter(t => t.cat !== 'S'), t = ts[Math.floor(R() * ts.length)], p = buildTpl(t), scenes = Object.keys(SCENES).filter(s => s !== 'white'), styl = Object.keys(STYLES); p.name = t.name + ' · 灵感'; const keep = P; P = p; applyStyle(P, styl[Math.floor(R() * styl.length)]); P.chars.forEach(c => { if (c.end.type !== 'continue' && R() < .5) { const ex = EXITS.filter(x => !['continue', 'door', 'merge', 'reverse', 'loop'].includes(x.id)); const e2 = ex[Math.floor(R() * ex.length)].id, ts0 = c.end.ts; setExitType(P, c, e2); c.end.ts = ts0; c.end.te = +(ts0 + (EXIT_BY[e2].dur || 3)).toFixed(2); } }); P.tpl = null; const out = P; P = keep; liveStop(); loadProject(out); closeDrawers(); closeHome(); toast('随机灵感：' + out.name); },
  shareCode: async () => { try { const code = await packShare(P); await navigator.clipboard.writeText(code); toast('分享码已复制（长度 ' + code.length + '）'); } catch (e) { $('#shareBox').value = await packShare(P); openShareBox(); } },
  shareImport: () => openShareBox(true),

document.addEventListener('click', e => { if (e.target.id === 'mPrev') ACTS.closePrev(); });
async function packShare(p) { const s = JSON.stringify(p); if (typeof CompressionStream === 'undefined') return 'T0:' + btoa(unescape(encodeURIComponent(s))); const cs = new CompressionStream('gzip'), w = cs.writable.getWriter(); w.write(new TextEncoder().encode(s)); w.close(); const buf = new Uint8Array(await new Response(cs.readable).arrayBuffer()); let bin = ''; buf.forEach(b => bin += String.fromCharCode(b)); return 'T1:' + btoa(bin); }
async function unpackShare(c) { c = c.trim(); if (c.startsWith('T0:')) return JSON.parse(decodeURIComponent(escape(atob(c.slice(3))))); if (!c.startsWith('T1:')) throw new Error('不是有效的分享码'); const bin = atob(c.slice(3)), arr = Uint8Array.from(bin, ch => ch.charCodeAt(0)), ds = new DecompressionStream('gzip'), w = ds.writable.getWriter(); w.write(arr); w.close(); return JSON.parse(await new Response(ds.readable).text()); }
function openShareBox(imp) { const m = $('#mShare'); m.classList.add('open'); $('#shareBox').value = imp ? '' : $('#shareBox').value; $('#shareGo').style.display = imp ? '' : 'none'; $('#shareT').textContent = imp ? '粘贴朋友发来的分享码，点“导入”' : '复制下面的分享码发给朋友'; }
ACTS.closeShare = () => $('#mShare').classList.remove('open');
ACTS.shareGo = async () => { try { const p = await unpackShare($('#shareBox').value); if (!p.chars) throw new Error('内容无效'); loadProject(p); ACTS.closeShare(); closeDrawers(); closeHome(); toast('已导入'); } catch (e) { toast('导入失败：' + e.message); } };

/* ---- home ---- */
function renderHome() {
  const w = worksList(), el = $('#home');
  el.innerHTML = `<div class="hwrap"><div class="hhead"><h1>TRACE</h1><p>人物轨迹实验室 · 让每个人的故事，都有自己的轨迹</p></div>
  <div class="hentry"><button class="hbtn" data-act="homeTpl"><b>① 选择模板</b><span>28 个原创模板，动态预览</span></button><button class="hbtn" data-act="homeBlank"><b>＋ 空白创作</b><span>从一条线开始</span></button><button class="hbtn" data-act="projImportHome"><b>📂 打开项目</b><span>导入 .json 或分享码</span></button><button class="hbtn" data-act="randInspire"><b>🎲 随机灵感</b><span>随机组合模板与风格</span></button></div>
  <div class="hmode"><span>使用模式</span><button data-act="setMode" data-v="beginner" class="${MODE() === 'beginner' ? 'on' : ''}">新手模式（精简界面）</button><button data-act="setMode" data-v="free" class="${MODE() === 'free' ? 'on' : ''}">自由模式（全部功能）</button><button data-act="tutorial">▶ 新手教程</button></div>
  ${w.length ? `<h3>我的作品 / 最近编辑</h3><div class="hworks">${w.map(x => `<div class="hw"><img src="${x.thumb}" alt=""><b>${esc(x.name)}</b><span>${new Date(x.ts).toLocaleString('zh-CN', { hour12: false })}</span><div class="row"><button data-act="workOpen" data-id="${x.id}">打开</button><button class="ic" data-act="workDel" data-id="${x.id}" title="删除">✕</button></div></div>`).join('')}</div>` : '<div class="mut small">还没有保存的作品。编辑时点顶部“存为作品”即可保存到这里。</div>'}
  ${P && P.chars.length ? '<div class="row" style="margin-top:14px"><button class="pri" data-act="closeHome">回到当前项目 →</button></div>' : ''}
  <div class="small mut" style="margin-top:18px">作品保存在你当前浏览器中，不上传服务器；换设备请用“导出项目”或“分享码”。本站没有账号与社区功能。</div></div>`;
}
const openHome = () => { renderHome(); $('#home').classList.add('open'); };
const closeHome = () => { $('#home').classList.remove('open'); LS.set('trace.seen', 1); };
Object.assign(ACTS, { openHome, closeHome, homeTpl: () => { closeHome(); renderTplDrawer(); openDrawer('dTpl'); }, homeBlank: () => { loadProject(buildTpl(tplOf('blank'))); P.tpl = 'blank'; closeHome(); flowStep(2); }, projImportHome: () => $('#fileProj').click(),
  workOpen: a => { const x = worksList().find(w => w.id === a.dataset.id); if (x) { loadProject(x.data); closeHome(); } }, workDel: a => { LS.set('trace.works', worksList().filter(w => w.id !== a.dataset.id)); renderHome(); },
  saveWork: () => { saveWork(); toast('已保存到“我的作品”'); } });
$('#bHome').onclick = openHome;

/* ---- mode / theme / flow ---- */
const MODE = () => LS.get('trace.mode', 'free');
function applyMode() { document.body.dataset.mode = MODE(); }
ACTS.setMode = a => { LS.set('trace.mode', a.dataset.v); applyMode(); if ($('#home').classList.contains('open')) renderHome(); toast(a.dataset.v === 'beginner' ? '新手模式：已隐藏高级功能' : '自由模式：全部功能'); };
function applyTheme() { document.documentElement.dataset.theme = LS.get('trace.theme', 'light'); }
ACTS.theme = () => { LS.set('trace.theme', LS.get('trace.theme', 'light') === 'light' ? 'dark' : 'light'); applyTheme(); };
const STEPS = [['1', '选模板'], ['2', '编辑人物'], ['3', '场景风格'], ['4', '导出']];
let FLOW = 1;
function flowStep(n) { FLOW = n; $$('#flow button').forEach((b, i) => b.classList.toggle('on', i + 1 === n)); }
$('#flow').innerHTML = STEPS.map(([n, l]) => `<button data-act="flow" data-n="${n}"><i>${n}</i>${l}</button>`).join('');
ACTS.flow = a => { const n = +a.dataset.n; flowStep(n); if (n === 1) { renderTplDrawer(); openDrawer('dTpl'); } else if (n === 2) { closeDrawers(); setLeftTab('chars'); setRightTab('path'); } else if (n === 3) openScene('scene'); else $('#bExport').click(); };
applyMode(); applyTheme();

/* ---- fullscreen preview ---- */
ACTS.fullscreen = () => { const w = $('#stagewrap'); if (document.fullscreenElement) return document.exitFullscreen(); (w.requestFullscreen || w.webkitRequestFullscreen || (() => Promise.reject())).call(w).then(() => { view.camPreview = true; $('#mCam').classList.add('on'); setT(0); setPlaying(true); }).catch(() => { view.camPreview = true; $('#mCam').classList.add('on'); toast('此环境不支持全屏，已切换为相机预览并播放'); setT(0); setPlaying(true); }); };
document.addEventListener('fullscreenchange', () => { resizeStage(); needRender = true; });

/* ---- help ---- */
const HELP = { stage: ['画布', '拖动控制点改变轨迹；双击空白处加点；右键删点；拖动空白平移，滚轮缩放。'], timeline: ['时间轴', '每行是一个角色。拖动条改变出现时间，拖动两端改变长度；点击标尺跳转。'], exit: ['出场', '在右侧“轨迹”里选择退场方式，共 20 种；每种可调开始/结束时间、速度、范围、粒子、发光等参数。'], scene: ['场景', '“场景与风格”里可叠加多种场景图层、改背景色、上传背景图。'], style: ['一键风格', '只换视觉（场景/配色/字体），不改轨迹。'], export: ['导出', '逐帧编码，导出真实视频；浏览器不支持 H.264 时会自动用 WebM。'], share: ['分享', '没有服务器，所以分享是复制“分享码”或导出 .json 发给对方，对方导入即可。'] };

ACTS.closeHelp = () => $('#mHelp').classList.remove('open');

/* ---- tutorial ---- */
function setLeftTab(t) { $$('#ltabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); ['chars', 'events', 'texts', 'layers'].forEach(k => $('#p-' + k).hidden = k !== t); if (t === 'layers') renderLayersPane(); }
function renderLayersPane() {
  const el = $('#p-layers'); if (!el || !P) return; const LYS = layersOf(P), sc = P.scene; migrateScene(P);
  el.innerHTML = `<div class="small mut" style="padding:4px 2px">七层独立控制：开关、透明度。下方可进一步增删背景/装饰/环境/前景里的具体图层。</div>` + LAYER_GROUPS.map(([k, n]) => { const sub = k === 'trail' || k === 'events' || k === 'text' ? [] : sc.layers.map((l, i) => [l, i]).filter(([l]) => (LAYER_GROUP[l.type] || 'env') === (k === 'bg' ? 'material' : k)); return `<div class="lyg"><label class="chk"><input type="checkbox" data-lg="${k}" data-f="on" ${LYS[k].on ? 'checked' : ''}> <b>${n}</b></label>${['events', 'text'].includes(k) ? '' : `<input type="range" min="0" max="1" step=".05" data-lg="${k}" data-f="a" value="${LYS[k].a}" title="透明度">`}${sub.map(([l, i]) => `<div class="lysub"><label class="chk"><input type="checkbox" data-ly2="${i}" ${l.on ? 'checked' : ''}> ${LAYER_TYPES[l.type]}</label></div>`).join('')}</div>`; }).join('') + `<div class="row"><button data-act="openScene">打开场景面板（增删图层）</button></div>`;
}
document.addEventListener('input', e => { const d = e.target.dataset; if (!d) return; if (d.lg) { const L = layersOf(P)[d.lg]; L[d.f] = e.target.type === 'checkbox' ? e.target.checked : +e.target.value; dirty(); } else if (d.ly2 != null) { P.scene.layers[+d.ly2].on = e.target.checked; dirty(); } });
document.addEventListener('change', e => { const d = e.target.dataset; if (d && (d.lg || d.ly2 != null)) commit(); });
{ const _ra = refreshAll; refreshAll = function (...a) { _ra(...a); renderLayersPane(); }; }
const TUT = [['#bTpl', '第 1 步：选一个模板', '点“模板库”，28 个模板都是动态预览，选一个“使用”。也可从空白开始。'], ['#left', '第 2 步：编辑人物', '这里是人物列表。点选人物后，画布上拖动控制点即可改变轨迹。'], ['#stage', '画布', '拖动点改路径，双击加点，滚轮缩放。点下方“播放”看动画。'], ['#tl', '时间轴', '拖动条调整每个人出现的时间与长度。'], ['#right', '属性面板', '这里只显示所选人物需要的设置：出场方式、线条、外观。'], ['#bScene', '第 3 步：场景与风格', '换场景、背景色、一键风格，只改视觉。'], ['#bExport', '第 4 步：导出视频', '选分辨率与帧率，导出 MP4/WebM。完成！']];
let TI = 0;
function tutStep() { const s = TUT[TI], el = $(s[0]), box = $('#tut'); if (!el || !el.offsetParent) { if (TI < TUT.length - 1) { TI++; return tutStep(); } return ACTS.tutEnd(); } const r = el.getBoundingClientRect(); const hl = $('#tuthl'); hl.style.cssText = `left:${r.left - 4}px;top:${r.top - 4}px;width:${r.width + 8}px;height:${r.height + 8}px`; $('#tutt').innerHTML = `<b>${s[1]}</b><p>${s[2]}</p><div class="row"><span class="mut small">${TI + 1}/${TUT.length}</span><span class="sp"></span><button data-act="tutEnd">跳过</button><button class="pri" data-act="tutNext">${TI === TUT.length - 1 ? '完成' : '下一步'}</button></div>`; const tb = $('#tutt'); tb.style.left = Math.max(8, Math.min(innerWidth - 300, r.left)) + 'px'; tb.style.top = (r.bottom + 160 > innerHeight ? Math.max(8, r.top - 150) : r.bottom + 12) + 'px'; box.classList.add('open'); }
Object.assign(ACTS, { tutorial: () => { closeHome(); TI = 0; tutStep(); }, tutNext: () => { TI++; TI >= TUT.length ? ACTS.tutEnd() : tutStep(); }, tutEnd: () => { $('#tut').classList.remove('open'); LS.set('trace.tut', 1); } });
addEventListener('resize', () => { if ($('#tut').classList.contains('open')) tutStep(); });
/* first run */
setTimeout(() => { if (!LS.get('trace.seen', 0)) { openHome(); } }, 400);
